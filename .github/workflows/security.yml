name: Security CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Django deploy checks
        env:
          VPS_ENVIRONMENT: "false"
          SECRET_KEY: ci-secret-key-with-sufficient-entropy-for-testing-only-12345
          DATABASE_URL: sqlite:///ci.db
          # Chave Fernet válida só para CI (32 bytes zero, url-safe) — não usar em produção
          FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          python manage.py migrate
          python manage.py check --deploy
          python manage.py check_security --strict

      - name: pip-audit (dependencies)
        run: pip-audit -r requirements.txt

      - name: Bandit (SAST)
        run: bandit -r core ftth_viewer alerts olt_ops saas_viabilidade -ll -q

      - name: Secret patterns scan
        run: bash scripts/security-check.sh
