name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          VPS_ENVIRONMENT: "false"
          SECRET_KEY: ci-secret-key-with-sufficient-entropy-for-testing-only-12345
          DATABASE_URL: sqlite:///ci_test.db
          FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QUOTA_ENFORCEMENT_ENABLED: "true"
        run: |
          python manage.py migrate
          python manage.py test core.tests_quotas core.tests_api_tenant olt_ops.tests_vpn_slot olt_ops.tests_dispatcher saas_viabilidade.tests_sentry_bootstrap --verbosity 1
