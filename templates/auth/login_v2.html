{% extends "base_auth_v2.html" %}
{% load static %}

{% block title %}Entrar — RM Systems{% endblock %}

{% block auth_content %}
<form method="post" class="form" id="loginForm">
    {% csrf_token %}
    <div class="ds-field">
        <label for="id_username">E-mail ou usuário</label>
        <input type="text" name="username" id="id_username" class="ds-input" placeholder="email@exemplo.com" required autocomplete="username">
    </div>
    <div class="ds-field">
        <label for="id_password">Senha</label>
        <div class="password-input-container">
            <input type="password" name="password" id="id_password" class="ds-input" required autocomplete="current-password">
            <button type="button" class="password-toggle ds-btn ds-btn--icon" id="passwordToggle" aria-label="Mostrar senha">
                <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="ds-field">
        <label class="ds-remember-label" for="rememberEmail">
            <input type="checkbox" id="rememberEmail" name="remember">
            <span class="ds-caption">Lembrar login neste dispositivo</span>
        </label>
    </div>
    <button type="submit" class="ds-btn ds-btn--primary w-100" id="actionBtn">Entrar</button>
</form>
{% endblock %}

{% block extra_scripts %}
<script nonce="{{ csp_nonce }}" src="{% static 'js/login.js' %}"></script>
{% endblock %}
